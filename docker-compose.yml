# Demo: solo la API. Los servicios comentados se activarán cuando existan sus adaptadores.
services:
  api:
    build: .
    image: safe-path-twin-api:0.1.0
    environment:
      PORT: ${PORT:-3000}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:$${PORT}/api/health || exit 1"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

